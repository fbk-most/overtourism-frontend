<div class="mb-3" *ngIf="scenarioIds.length > 0">

  <!-- Pulsante di Generazione (visibile quando non c'è sommario e non sta caricando) -->
  <div *ngIf="!aiSummary && !aiSummaryLoading" class="my-3">
    <button class="btn btn-outline-primary d-flex align-items-center gap-2" (click)="generateAiSummary()">
      <span class="material-icons">auto_awesome</span>
      <span>Genera sommario </span>
    </button>
  </div>

  <!-- Loading -->
  <div class="d-flex align-items-center gap-2 text-muted small py-2" *ngIf="aiSummaryLoading">
    <div class="spinner-border spinner-border-sm" role="status"></div>
    <span>Generazione sommario in corso...</span>
  </div>

  <!-- Errore con pulsante Riprova -->
  <div class="alert alert-warning py-2 small d-flex justify-content-between align-items-center" *ngIf="aiSummaryError">
    <div>
      <span class="material-icons align-middle me-1" style="font-size:16px;">warning</span>
      Impossibile generare il sommario automatico.
    </div>
    <button class="btn btn-sm btn-outline-secondary" (click)="generateAiSummary()">Riprova</button>
  </div>

  <!-- Risultato Sommario -->
  <div *ngIf="aiSummary && !aiSummaryLoading" class="mb-4">
    <div class="small text-dark ai-summary-content" [innerHTML]="aiSummary"></div>
  </div>
</div>
