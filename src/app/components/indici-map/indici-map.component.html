<div class="map-wrapper position-relative">
  <div *ngIf="mapTitle" 
       class="position-absolute w-100 text-center" 
       style="top: 10px; left: 0; z-index: 1000; pointer-events: none;">
    <span class="bg-white px-3 py-1 rounded shadow-sm fw-bold" style="font-size: 14px;">
      {{ mapTitle }}
    </span>
  </div>
  
  <div #mapEl class="indici-map"></div>
</div>
