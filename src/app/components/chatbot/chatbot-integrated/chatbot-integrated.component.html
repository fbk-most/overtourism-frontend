<!-- Floating button -->
<div class="chatbot-button" (click)="toggle()">💬</div>

@if (isOpen) {
  <div class="chatbot-window" (focusin)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
    <div class="chatbot-header">
      Chatbot
      <span class="close" (click)="toggle()">✕</span>
    </div>
    <div class="chatbot-messages" #scrollContainer>
      @for (msg of messages; track msg; let i = $index) {
        <div
          [ngClass]="{ 'user': msg.role === 'user', 'bot': msg.role === 'assistant' }">
          @if (msg.role === 'user') {
            <div class="message-text">{{ msg.content }}</div>
          }
          @if (msg.role === 'assistant') {
            <div>
              <div class="message-text markdown-body"
                [innerHTML]="msg.html ?? msg.content"
              (click)="handleAssistantLinkClick($event)"></div>
              <!-- Usa il componente condiviso e passa l'indice reale (i) e non msg.index se non necessario -->
              @if (i > 0) {
                <app-chat-feedback-bar
                  [feedback]="getFeedback(i)"
                  (voteChange)="handleVote(i, $any($event))"
                  (commentChange)="handleComment(i, $event)">
                </app-chat-feedback-bar>
              }
            </div>
          }
        </div>
      }
      <!-- Typing indicator -->
      @if (isTyping) {
        <div class="bot typing">
          <div class="message-text">
            <span></span><span></span><span></span>
          </div>
          @if (statusMessage) {
            <div class="status-text">{{ statusMessage }}</div>
          }
        </div>
      }
    </div>
    <div class="chatbot-input">
      <textarea
        [(ngModel)]="inputText"
        (keydown)="handleKeyDown($event)"
        spellcheck="false"
        placeholder="Scrivi qui il tuo messaggio..."
        rows="1"
      ></textarea>
      <button (click)="send()" [disabled]="isTyping">Invia</button>
    </div>
  </div>
}
