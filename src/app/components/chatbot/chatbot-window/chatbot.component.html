<!-- Floating button -->
<div class="chatbot-button" (click)="toggle()">💬</div>

<!-- Chat window -->
<div class="chatbot-window" *ngIf="isOpen">
  <div class="chatbot-header">
    Chatbot
    <span class="close" (click)="toggle()">✕</span>
  </div>

  <div class="chatbot-messages">
    <div
      *ngFor="let msg of messages"
      [class.user]="msg.sender === 'user'"
      [class.bot]="msg.sender === 'bot'"
    >
      <div class="message-text" *ngIf="msg.sender === 'user'">{{ msg.text }}</div>

      <div *ngIf="msg.sender === 'bot'">
        <div class="message-text markdown-body" [innerHTML]="msg.html"></div>
        <div *ngIf="msg.inlineActions" class="mt-3">
          <div *ngIf="msg.inlineActions" class="mt-3">
            <ng-container *ngFor="let action of msg.inlineActions">
              
              <ng-container *ngIf="action.type === 'SHOW_WIDGET'">
                <!-- Container per i Widget inline della chat -->
                <div class="p-2 bg-white rounded shadow-sm w-100 mb-3" style="min-height: 250px;">
                  
                  <!-- ngComponentOutlet inietta il Component dinamicamente! -->
                  <ng-container 
                    *ngComponentOutlet="widgetRegistry[action.payload.widgetName!]; inputs: action.payload.data">
                  </ng-container>
  
                </div>
              </ng-container>
  
            </ng-container>
          </div>
        <!-- Feedback bar -->
        <!-- Only show feedback for real agent responses, not the greeting -->
        <div class="feedback-bar" *ngIf="msg.index! > 0">
          <button
            class="fb-btn"
            [class.fb-active-up]="getFeedback(msg.index!).vote === 'up'"
            title="Good response"
            (click)="handleVote(msg.index!, 'up')"
          >👍</button>

          <button
            class="fb-btn"
            [class.fb-active-down]="getFeedback(msg.index!).vote === 'down'"
            title="Bad response"
            (click)="handleVote(msg.index!, 'down')"
          >👎</button>

          <button
            class="fb-btn"
            [class.fb-has-comment]="getFeedback(msg.index!).comment"
            title="Add comment"
            (click)="$event.stopPropagation(); openCommentModal(msg.index!)"
          >💬</button>

          <span class="fb-comment-label" *ngIf="getFeedback(msg.index!).comment">
            "{{ getFeedback(msg.index!).comment }}"
          </span>
        </div>
      </div>
    </div>

    <!-- Typing indicator -->
    <div *ngIf="isTyping" class="bot typing">
      <div class="message-text">
        <span></span><span></span><span></span>
      </div>
      <div class="status-text" *ngIf="statusMessage">{{ statusMessage }}</div>
    </div>
  </div>

  <div class="chatbot-input">
    <input
      type="text"
      [(ngModel)]="inputText"
      (keydown.enter)="send()"
      spellcheck="false"
      placeholder="Scrivi qui il tuo messaggio"
    />
    <button (click)="send()">Invia</button>
  </div>
</div>

<!-- Comment modal -->
<div class="fb-overlay" *ngIf="showFeedbackModal" (click)="closeCommentModal()">
  <div class="fb-modal" (mousedown)="$event.stopPropagation()" (click)="$event.stopPropagation()">
    <h3>Add feedback</h3>
    <textarea
      [(ngModel)]="modalDraft"
      placeholder="What could be improved? (optional)"
      rows="4"
    ></textarea>
    <div class="fb-modal-actions">
      <button class="fb-btn-cancel" (click)="closeCommentModal()">Cancel</button>
      <button class="fb-btn-save" (click)="saveComment()">Save</button>
    </div>
  </div>
</div>
