<div class="chatbot-app">
  <div class="chatbot-app">

    <div class="context-bar">
      <div class="d-flex align-items-center gap-2">
            </div>
  
      <button class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1 py-1 px-2"
              (click)="startNewChat()"
              [disabled]="loading"
              title="Inizia una nuova sessione e pulisci la chat">
        <it-icon name="plus"  class="icon-primary" size="xs"></it-icon>
        <span class="small fw-semibold">Nuova chat</span>
      </button>
    </div>
  
    <div class="chat-wrapper" #chatRef>
      <div class="chat-container">
        
        <div class="empty-state text-muted text-center mt-5" *ngIf="messages.length === 0">
          <it-icon name="comment" size="lg" class="mb-3"></it-icon>
          <h5>Come posso aiutarti oggi?</h5>
          <p>Invia un messaggio per iniziare la conversazione.</p>
        </div>
  
        <ng-container *ngFor="let msg of messages; let i = index">
       
        <app-chat-message
          [msg]="msg"
          [feedback]="feedbacks[i] || {}"
          (voteChange)="onVote(i, $event)"
          (commentChange)="onComment(i, $event)">
        </app-chat-message>

        <!-- Widget inline - solo per messaggi assistant -->
        <ng-container *ngIf="msg.role === 'assistant' && msg.inlineActions?.length">
          <div *ngFor="let action of msg.inlineActions"
               class="widget-inline-container">
            <ng-container
              *ngComponentOutlet="
                widgetRegistry[action.payload['widgetName']];
                inputs: action.payload['data']
              ">
            </ng-container>
          </div>
        </ng-container>

      </ng-container>

      <div class="message assistant loading-bubble" *ngIf="loading">
        <div class="dots"><span></span><span></span><span></span></div>
        <span class="status-msg" *ngIf="statusMessage">{{ statusMessage }}</span>
      </div>

    </div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      
      <div class="input-inner shadow-sm focus-ring">
        <textarea
          #textareaRef
          [(ngModel)]="input"
          (input)="onInputChange($event)"
          (keydown)="handleKeyDown($event)"
          placeholder="Scrivi al Digital Twin Agent..."
          [disabled]="loading"
          rows="1"
          spellcheck="false">
        </textarea>
        
        <button class="icon-btn send-btn"
          [class.active]="input.trim().length > 0"
          (click)="sendMessage()"
          [disabled]="loading || !input.trim()">
          <it-icon name="arrow-right" class="icon-white bg-white" size="sm"></it-icon>
        </button>
      </div>
      
    </div>
  </div>

</div>
