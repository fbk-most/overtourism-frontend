<div class="chatbot-app">

  <div class="chat-wrapper" #chatRef>
    <div class="chat-container">
      
      <div class="empty-state text-muted text-center mt-5" *ngIf="messages.length === 0">
        <it-icon name="comment" size="lg" class="mb-3"></it-icon>
        <h5>Come posso aiutarti oggi?</h5>
        <p>Invia un messaggio o allega un file per iniziare.</p>
      </div>

      <ng-container *ngFor="let msg of messages; let i = index">
        
        <app-chat-message
          [msg]="msg"
          [sessionId]="sessionId"
          [feedback]="feedbacks[i] || {}"
          (sliderSubmit)="onSliderSubmit($event)"
          (voteChange)="onVote(i, $event)"
          (commentChange)="onComment(i, $event)">
        </app-chat-message>

        <!-- Widget inline - solo per messaggi assistant -->
        <ng-container *ngIf="msg.role === 'assistant' && msg.inlineActions?.length">
          <div *ngFor="let action of msg.inlineActions"
               class="widget-inline-container">
            <ng-container
              *ngComponentOutlet="
                widgetRegistry[action.payload['widgetName']];
                inputs: action.payload['data']
              ">
            </ng-container>
          </div>
        </ng-container>

      </ng-container>

      <div class="message assistant loading-bubble" *ngIf="loading">
        <div class="dots"><span></span><span></span><span></span></div>
        <span class="status-msg" *ngIf="statusMessage">{{ statusMessage }}</span>
      </div>

    </div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      
      <div *ngIf="attachments.length > 0" class="attachments-preview mb-2">
        <div *ngFor="let file of attachments; let i = index" class="attachment-badge">
          <it-icon name="clip" size="xs"></it-icon>
          <span class="file-name text-truncate">{{ file.name }}</span>
          <it-icon name="close" size="xs" class="remove-attachment" (click)="removeAttachment(i)"></it-icon>
        </div>
      </div>

      <div class="input-inner shadow-sm focus-ring">
        <button class="icon-btn attach-btn" (click)="fileInputRef.click()" title="Allega file">
          <it-icon name="plus" size="sm"></it-icon>
        </button>
        <input type="file" multiple (change)="onFileChange($event)" #fileInputRef style="display:none" />
        
        <textarea
          #textareaRef
          [(ngModel)]="input"
          (input)="onInputChange($event)"
          (keydown)="handleKeyDown($event)"
          placeholder="Scrivi al Digital Twin Agent..."
          [disabled]="loading"
          rows="1"
          spellcheck="false">
        </textarea>
        
        <button class="icon-btn send-btn"
          [class.active]="input.trim().length > 0 || attachments.length > 0"
          (click)="sendMessage()"
          [disabled]="loading || (!input.trim() && attachments.length === 0)">
          <it-icon name="arrow-right" class="icon-white bg-white" size="sm"></it-icon>
        </button>
      </div>
      
    </div>
  </div>

</div>
