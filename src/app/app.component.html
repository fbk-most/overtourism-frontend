<!-- AREA PRIVATA-->
@if (authService.isLoggedIn) {
  <div class="d-flex flex-column min-vh-100">
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>
    <div class="d-flex flex-grow-1">
      <main class="p-4 w-100">
        <app-breadcrumbs></app-breadcrumbs>
        @if (showTerritoryReference && authService.activeTerritory) {
          <div class="territory-context-reference">
            <span class="material-icons" aria-hidden="true">place</span>
            <span>Contesto territoriale</span>
            <strong>{{ authService.activeTerritory | titlecase }}</strong>
          </div>
        }
        <router-outlet></router-outlet>
      </main>
    </div>
    <app-footer></app-footer>
    @if (showIntegratedChatbot) {
      <app-chatbot-integrated></app-chatbot-integrated>
    }
  </div>
} @else {
  <router-outlet></router-outlet>
}

<!-- AREA PUBBLICA-->

<app-toast></app-toast>
