<!-- AREA PRIVATA-->
<ng-container *ngIf="authService.isLoggedIn; else loginLayout">
  <div class="d-flex flex-column min-vh-100">

  <app-header (toggleSidebar)="toggleSidebar()"></app-header>
  
  <div class="d-flex flex-grow-1">
    <main class="p-4 w-100">
      <app-breadcrumbs></app-breadcrumbs>
      <div *ngIf="showTerritoryReference && authService.activeTerritory" class="territory-context-reference">
        <span class="material-icons" aria-hidden="true">place</span>
        <span>Contesto territoriale</span>
        <strong>{{ authService.activeTerritory | titlecase }}</strong>
      </div>
      <router-outlet></router-outlet>
    </main>
  </div>
  
  <app-footer></app-footer>
  <app-chatbot-integrated *ngIf="showIntegratedChatbot"></app-chatbot-integrated>

  </div>
</ng-container>

<!-- AREA PUBBLICA-->
<ng-template #loginLayout>
  <router-outlet></router-outlet>
</ng-template>

<app-toast></app-toast>
