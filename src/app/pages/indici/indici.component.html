<div class="container-fluid my-2"
  [attr.data-assistant-index-id]="assistantState?.indicator || null"
  [attr.data-assistant-start-date]="assistantState?.startDate || null"
  [attr.data-assistant-end-date]="assistantState?.endDate || null"
  [attr.data-assistant-granularity]="assistantState?.granularity || null"
  [attr.data-assistant-selected-territories]="selectedTerritoriesJson">

  <!-- BARRA FILTRI ESTRATTA -->
  @if (allIndicators.length) {
    <app-indici-filters
      [allIndicators]="allIndicators"
      [additionalLabels]="additionalLabels"
      [showOption]="showOption"
      [loading]="loading"
      [hasData]="!!geoEnvelope || chartSeries.length > 0"
      (stateChange)="onFilterStateChange($event)"
      (apply)="onApplyFilters($event)">
    </app-indici-filters>
  }

  <!-- CONTENUTO TABS -->
  <div class="indici-content position-relative">

    <it-tab-container (tabSelected)="onTabSelected($event)">
      <!-- TAB 1: MAPPA -->
      <it-tab-item label="Mappa" icon="map-marker" [active]="showOption === 'map'">
        <div class="p-2">
          @if (geoEnvelope) {
            <app-indici-map
              data-assistant-chart
              [attr.data-assistant-chart-index-id]="assistantMapState?.indicator || null"
              [attr.data-assistant-chart-label]="assistantMapTitle || null"
              [attr.data-assistant-chart-start-date]="assistantMapState?.startDate || null"
              [attr.data-assistant-chart-end-date]="assistantMapState?.endDate || null"
              [attr.data-assistant-chart-granularity]="assistantMapState?.granularity || null"
              [geojsonStr]="geoEnvelope.data"
              [minValue]="geoEnvelope.min_value"
              [maxValue]="geoEnvelope.max_value"
              [legend]="geoEnvelope.legend"
              [flows]="flowData"
              [colorScaleMode]="colorScaleMode"
              [unitDescription]="unitDescription"
              [mapTitle]="currentMapTitle">
            </app-indici-map>
          } @else {
            @if (!loading) {
              <div class="empty-hint p-5 text-center text-muted mt-5">
                Seleziona i parametri e clicca <strong>Applica filtri</strong> per caricare la mappa.
              </div>
            }
          }
        </div>
      </it-tab-item>

      <!-- TAB 2: GRAFICI -->
      <it-tab-item label="Grafici" icon="chart-line" [active]="showOption === 'chart'"
        [disabled]="isChartDisabled">
        <app-indici-chart
          [attr.data-assistant-chart]="chartSeries.length ? '' : null"
          [attr.data-assistant-chart-index-id]="assistantChartState?.indicator || null"
          [attr.data-assistant-chart-label]="assistantChartLabel || null"
          [attr.data-assistant-chart-start-date]="assistantChartState?.startDate || null"
          [attr.data-assistant-chart-end-date]="assistantChartState?.endDate || null"
          [attr.data-assistant-chart-granularity]="assistantChartState?.granularity || null"
          [chartLabels]="chartLabels"
          [chartSeries]="chartSeries"
          [allComuni]="allComuni"
          [allAreas]="allAreas"
          [(selectedComuni)]="selectedComuni"
          [(selectedAreas)]="selectedAreas"
          [spatialGranularity]="filterState?.spatialGranularity || 'comune'"
          [granularity]="filterState?.granularity || 'mensile'"
          (granularityChange)="onGranularityChange($event)"
          [chartTitle]="currentMeta?.label || ''"
          [unitDescription]="unitDescription"
          [codeToName]="codeToName"
          [loading]="loading">
        </app-indici-chart>
      </it-tab-item>
    </it-tab-container>

    <!-- Overlay caricamento -->
    @if (loading) {
      <div class="d-flex justify-content-center align-items-center w-100 h-100 position-absolute top-0 start-0 bg-white"
        style="z-index: 10; opacity: 0.8;">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
      </div>
    }
  </div>
</div>
