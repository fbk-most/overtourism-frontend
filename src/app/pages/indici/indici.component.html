<div class="container-fluid my-2">

  <!-- ── Pannello filtri ────────────────────────────────────────────────── -->
  <it-card background="true" class="px-4 pt-3 pb-2 mb-2">

    <!-- RIGA 1: sempre visibile + bottone -->
    <div class="d-flex flex-wrap gap-2 align-items-end">

      <div class="d-flex flex-column" style="min-width:150px; flex:1 1 150px; max-width:200px;">
        <label class="form-label fw-bold mb-1" style="font-size:13px;">Cosa mostrare</label>
        <select class="form-select form-select-sm" [(ngModel)]="showOption" (ngModelChange)="onShowOptionChange()">
          <option value="map">Mappa</option>
          <option value="variation-chart">Tasso variazione – grafico</option>
          <option value="variation-map">Tasso variazione – mappa</option>
        </select>
      </div>

      <div class="d-flex flex-column" style="min-width:130px; flex:1 1 130px; max-width:170px;">
        <label class="form-label fw-bold mb-1" style="font-size:13px;">Granularità terr.</label>
        <select class="form-select form-select-sm" [(ngModel)]="spatialGranularity">
          <option value="comune">Comunale</option>
          <option value="macro_area">Macro area</option>
        </select>
      </div>

      <div class="d-flex flex-column" style="min-width:180px; flex:2 1 180px; max-width:300px;">
        <label class="form-label fw-bold mb-1" style="font-size:13px;">Indicatore</label>
        <select class="form-select form-select-sm" [(ngModel)]="selectedIndicator" (ngModelChange)="onIndicatorChange()">
          <option *ngFor="let ind of visibleIndicators" [value]="ind.value">{{ ind.label }}</option>
        </select>
      </div>

      <div class="d-flex flex-column" style="min-width:140px; flex:1 1 140px; max-width:180px;">
        <label class="form-label fw-bold mb-1" style="font-size:13px;">
          Inizio
          <small class="text-muted fw-normal" *ngIf="currentMeta?.years_range">
            ({{currentMeta!.years_range.min_year}}-{{currentMeta!.years_range.max_year}})
          </small>
        </label>
        <input type="date" class="form-control form-control-sm" [(ngModel)]="startDate"
               [attr.min]="minDateBound || null" [attr.max]="maxDateBound || null">
      </div>

      <div class="d-flex flex-column" style="min-width:140px; flex:1 1 140px; max-width:180px;">
        <label class="form-label fw-bold mb-1" style="font-size:13px;">Fine</label>
        <input type="date" class="form-control form-control-sm" [(ngModel)]="endDate"
               [attr.min]="minDateBound || null" [attr.max]="maxDateBound || null">
      </div>

      <!-- Bottone sempre nella riga 1 -->
      <div class="d-flex flex-column justify-content-end ms-auto" style="flex:0 0 auto;">
        <button itButton="primary" size="sm" (click)="getData()" [disabled]="loading">
               <ng-container *ngIf="!loading">Applica filtri</ng-container>
          <ng-container *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-1" role="status"></span>
            Caricamento...
          </ng-container>
        </button>
      </div>

    </div>

    <!-- RIGA 2: opzionale, appare solo se necessario -->
    <div class="d-flex flex-wrap gap-2 align-items-end mt-2 pt-2 border-top"
         *ngIf="showSeasonality || showGranularity || showComparisonDates || showComuni">

      <div class="d-flex flex-column" style="min-width:150px; flex:1 1 150px; max-width:200px;" *ngIf="showSeasonality">
        <label class="form-label fw-bold mb-1" style="font-size:13px;">Stagionalità</label>
        <select class="form-select form-select-sm" [(ngModel)]="seasonality">
          <option value="high">Alta stagione (lug–ago)</option>
          <option value="shoulder">Stagioni spalla</option>
          <option value="weekend">Weekend</option>
        </select>
      </div>

      <ng-container *ngIf="showComparisonDates">
        <div class="d-flex flex-column" style="min-width:140px; flex:1 1 140px; max-width:180px;">
          <label class="form-label fw-bold mb-1" style="font-size:13px;">
            Inizio confronto
            <small class="text-muted fw-normal" *ngIf="currentMeta?.years_range">
              ({{currentMeta!.years_range.min_year}}-{{currentMeta!.years_range.max_year}})
            </small>
          </label>
          <input type="date" class="form-control form-control-sm" [(ngModel)]="startDateComparison"
                 [attr.min]="minDateBound || null" [attr.max]="maxDateBound || null">
        </div>
        <div class="d-flex flex-column" style="min-width:140px; flex:1 1 140px; max-width:180px;">
          <label class="form-label fw-bold mb-1" style="font-size:13px;">Fine confronto</label>
          <input type="date" class="form-control form-control-sm" [(ngModel)]="endDateComparison"
                 [attr.min]="minDateBound || null" [attr.max]="maxDateBound || null">
        </div>
      </ng-container>

      <div class="d-flex flex-column" style="min-width:150px; flex:1 1 150px; max-width:200px;" *ngIf="showGranularity">
        <label class="form-label fw-bold mb-1" style="font-size:13px;">Granularità temp.</label>
        <select class="form-select form-select-sm" [(ngModel)]="granularity">
          <option value="annuale">Annuale</option>
          <option value="mensile">Mensile</option>
          <option value="giornaliero">Giornaliero</option>
        </select>
      </div>

      <div class="d-flex flex-column position-relative" style="min-width:200px; flex:2 1 200px; max-width:320px;" *ngIf="showComuni">
        <label class="form-label fw-bold mb-1" style="font-size:13px;">Cerca comune</label>
        <input type="text" class="form-control form-control-sm"
               placeholder="Cerca un comune..."
               [(ngModel)]="comuniQuery"
               (input)="onComuniInput()"
               (focus)="comuniDropdownOpen = true"
               (blur)="comuniDropdownOpen = false"
               autocomplete="off">
        <div class="comuni-dropdown" *ngIf="comuniDropdownOpen && comuniQuery.length > 0">
          <div *ngFor="let c of filteredComuni"
               class="comuni-item"
               [class.selected]="isComuneSelected(c.code)"
               (mousedown)="$event.preventDefault(); toggleComune(c.code)">
            {{ c.name }}
          </div>
        </div>
      </div>

      <!-- Chips comuni selezionati -->
      <div class="d-flex flex-wrap gap-1 align-items-center" *ngIf="selectedComuni.length > 0">
        <span *ngFor="let code of selectedComuni"
              class="badge bg-primary d-inline-flex align-items-center px-2 py-1 rounded-pill">
          <span class="me-1 fw-semibold" style="font-size:0.8rem;">{{ codeToName.get(code) || code }}</span>
          <button type="button" class="btn p-0 text-white d-flex align-items-center" (click)="removeComune(code)">
            <span class="material-icons" style="font-size:14px;">close</span>
          </button>
        </span>
      </div>

    </div>

  </it-card>

  <!-- ── Info indicatore ────────────────────────────────────────────────── -->
  <it-card background="true" class="p-3 mb-4" *ngIf="currentMeta?.index_description">
    <div class="d-flex align-items-start gap-2">
      <span class="material-icons text-primary mt-1" style="font-size:20px;">info</span>
      <div class="small text-dark" style="line-height:1.5;">
        <strong class="d-block mb-1">{{ currentMeta?.label }}</strong>
        {{ currentMeta?.index_description }}
      </div>
    </div>
  </it-card>

  <!-- ── Errori ─────────────────────────────────────────────────────────── -->
  <div class="alert alert-danger mb-4" *ngIf="error">
    <span class="material-icons align-middle me-2">error_outline</span>{{ error }}
  </div>

  <!-- ── Area contenuto ─────────────────────────────────────────────────── -->
  <it-card background="true" class="p-4 mb-4">

    <ng-container *ngIf="showMap">
      <app-indici-map
        *ngIf="geoEnvelope; else mapHint"
        [geojsonStr]="geoEnvelope.data"
        [minValue]="geoEnvelope.min_value"
        [maxValue]="geoEnvelope.max_value"
        [colorScaleMode]="colorScaleMode">
      </app-indici-map>
      <ng-template #mapHint>
        <div class="empty-hint" *ngIf="!loading">
          Seleziona i filtri e clicca <strong>Applica filtri</strong> per visualizzare la mappa.
        </div>
      </ng-template>
    </ng-container>

    <ng-container *ngIf="showChart">
      <div class="empty-hint" *ngIf="!chartSeries.length && !loading">
        Seleziona i filtri e clicca <strong>Applica filtri</strong>.
      </div>
      <div #chartEl></div>
    </ng-container>

    <div class="empty-hint" *ngIf="loading">
      <div class="spinner-border text-primary"></div>
    </div>

  </it-card>

</div>
