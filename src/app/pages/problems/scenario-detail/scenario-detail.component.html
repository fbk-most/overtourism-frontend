<div class="row my-2 align-items-start">
  <div class="col">
    <h4 class="mb-1">{{ scenario?.name || 'Loading...' }}</h4>
    @if (scenario?.description) {
      <p class="mb-0 text-muted">{{ scenario?.description }}</p>
    }
  </div>
  <div class="col-auto">
    <app-report-export [context]="{ scenarios: [scenarioId] }"></app-report-export>
  </div>
  @if (scenarioId !== 'model_0' && authService.canEdit()) {
    <div class="col-auto">
      <button itButton="danger" type="button" (click)="openDeleteModal()" title="Elimina questo scenario" aria-label="Elimina definitivamente lo scenario">
        {{ 'common.delete' | translate }}
      </button>
    </div>
  }
</div>

<div class="my-4 d-flex flex-column w-100"
  [attr.data-assistant-problem-id]="problemId"
  [attr.data-assistant-proposal-id]="proposalId"
  [attr.data-assistant-scenario-id]="scenarioId">
  <app-plot [scenarioId]="scenarioId" [problemId]="problemId" [version]="scenario?.version || 0" [proposalId]="proposalId" [scenarioName]="scenario?.name || ''"></app-plot>
</div>
<it-modal #deleteModal id="deleteModal">
  <ng-container modalTitle>Elimina scenario</ng-container>
  <p>
    Vuoi davvero eliminare lo scenario <b>{{ scenario?.name }}</b>?<br />
    L'operazione non può essere annullata.
  </p>
  <ng-container footer>
    <button itButton="outline-primary" type="button" (click)="onCancelDelete()">Annulla</button>
    <button itButton="danger" type="button" (click)="confirmDelete()">Elimina</button>
  </ng-container>
</it-modal>
